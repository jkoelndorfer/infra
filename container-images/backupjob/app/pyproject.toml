[project]
name = "backupjob"
version = "1.0.0"
description = "Backup Job"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kubernetes>=36.0.3,<38",
    "requests>=2.32.5,<3",
]

[dependency-groups]
dev = [
		"coverage>=7.15.2, <8",
    "mypy>=1.20.2",
    "pytest>=9.1.1, <10",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
	"slow: marks a test as slow",
	"live: marks a test as interacting with live services",
]

[tool.coverage.report]
# This list is adapted from
# https://coverage.readthedocs.io/en/latest/excluding.html#advanced-exclusion
exclude_also = [
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]
