[project]
name = "deploy"
version = "0.1.0"
description = "Infrastructure deployment"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2, <9",
    "ipython>=9.16.0, <10",
    "kubernetes>=37.0.1, <38",
    "pulumi==3.273.0",
    "pulumi-aws>=7.48.0",
    "pulumi-command>=1.2.1",
    "pulumi-gcp>=9.37.0",
    "pulumi-kubernetes>=4.34.2",
    "pulumi-random>=4.21.2, <5",
    "pyinfra>=3.10.0,<4",
    "pyyaml>=6.0.3, <7",
    "rich>=15.0.0, <16",
]

[dependency-groups]
dev = [
		"coverage>=7.15.2, <8",
    "mypy>=1.20.2",
    "pytest>=9.1.1, <10",
    "ruff>=0.15.12",
		"types-pyyaml",
]

[tool.pytest.ini_options]
# --strict-markers turns a misspelled marker into an error rather than a marker
# that silently selects nothing.
addopts = ["--strict-markers"]
markers = [
  "slow: runs real Pulumi operations against a temporary backend; deselect with '-m \"not slow\"'",
]
filterwarnings = [
  "ignore::DeprecationWarning:pulumi_aws.*",
]

[tool.coverage.report]
# This list is adapted from
# https://coverage.readthedocs.io/en/latest/excluding.html#advanced-exclusion
exclude_also = [
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]

omit = [
  "cli/__main__.py",
]

[[tool.mypy.overrides]]
module = [
  "kubernetes.*",
]
ignore_missing_imports = true

# boto3 is provided by the Lambda runtime for function code, such as the dns.dyndns
# function. It is not a dependency of the deployment code.
[[tool.mypy.overrides]]
module = [
  "boto3",
  "boto3.*",
]
ignore_missing_imports = true

[tool.ruff.lint]
# Ruff 0.17 selects more rules by default. Keep the rules that ruff 0.15 selected.
select = ["E4", "E7", "E9", "F"]
