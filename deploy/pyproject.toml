[project]
name = "deploy"
version = "0.1.0"
description = "Infrastructure deployment"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2, <9",
    "ipython>=9.16.0, <10",
    "pulumi==3.255.0",
    "pulumi-aws>=7.41.0",
    "pulumi-command>=1.2.1",
    "pulumi-gcp>=9.33.0",
    "pulumi-kubernetes>=4.33.0",
    "pyyaml>=6.0.3, <7",
    "rich>=15.0.0, <16",
]

[dependency-groups]
dev = [
		"coverage>=7.15.2, <8",
    "mypy>=1.20.2",
    "pytest>=9.1.1, <10",
    "ruff>=0.15.12",
		"types-pyyaml",
]

[tool.coverage.report]
# This list is adapted from
# https://coverage.readthedocs.io/en/latest/excluding.html#advanced-exclusion
exclude_also = [
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]

omit = [
  "cli/__main__.py",
]
